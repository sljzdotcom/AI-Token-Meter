name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code0-bridge:
    name: Code0 passive bridge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify native bridge resource matches shared source
        run: python3 scripts/sync-code0-bridge.py --check
      - name: Test passive website bridge with synthetic responses
        run: node --test web/code0-bridge.test.mjs
  test:
    name: Swift tests and public-release checks
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify Swift toolchain
        run: swift --version
      - name: Install secret scanner
        run: brew install gitleaks
      - name: Test and validate documentation
        run: bash scripts/test.sh
      - name: Verify Antigravity recovery controls in hosted windows
        env:
          AI_METER_SCREEN_TESTS: "1"
        run: bash scripts/test.sh --skip-build --no-parallel --filter SettingsLocalizationCoverageTests
