name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Swift tests and public-release checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install secret scanner
        run: brew install gitleaks
      - name: Test and validate documentation
        run: bash scripts/test.sh
