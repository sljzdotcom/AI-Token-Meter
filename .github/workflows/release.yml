name: Cross-platform release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed and tagged (without v)
        required: true
        type: string
      build:
        description: Monotonic macOS build number
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cross-platform-release
  cancel-in-progress: false

jobs:
  macos-preflight:
    name: Verify tagged macOS release
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - name: Verify version, build, and tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/AIMeterApp/Resources/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Sources/AIMeterApp/Resources/Info.plist)" = "$BUILD_NUMBER"
          test "$(git describe --tags --exact-match HEAD)" = "v$VERSION"
      - name: Test and validate tagged source
        run: |
          bash scripts/test.sh
          ruby scripts/check-cross-platform-contracts.rb .
      - name: Verify signed macOS assets in the draft or public recovery release
        shell: bash
        run: |
          set -euo pipefail
          release_state="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          [[ "$release_state" == "true" || "$release_state" == "false" ]]
          if [[ "$VERSION" == *-preview.* ]]; then
            appcast="preview-appcast.xml"
          else
            appcast="appcast.xml"
          fi
          mkdir -p "$RUNNER_TEMP/macos-release"
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/macos-release" \
            --pattern "AI-Token-Meter-${VERSION}-macOS-arm64.zip" \
            --pattern "AI-Token-Meter-${VERSION}-macOS-arm64.zip.sha256" \
            --pattern "$appcast"
          cd "$RUNNER_TEMP/macos-release"
          shasum -a 256 -c "AI-Token-Meter-${VERSION}-macOS-arm64.zip.sha256"
          grep -Fq "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "$appcast"
          grep -Fq "sparkle:edSignature=" "$appcast"

  windows-release:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - name: Verify signing credentials are configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured"
          }
      - name: Install and test Windows source
        working-directory: windows
        run: npm ci
      - name: Test frontend
        working-directory: windows
        run: npm test
      - name: Build frontend
        working-directory: windows
        run: npm run build
      - name: Check, lint, and test Rust
        working-directory: windows/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Verify synchronized source versions
        shell: bash
        run: ruby scripts/check-cross-platform-contracts.rb .
      - name: Build signed Windows updater and NSIS installer
        working-directory: windows
        shell: pwsh
        run: |
          $config = if ($env:VERSION -match "-preview\.") {
            "src-tauri/tauri.preview.release.conf.json"
          } else {
            "src-tauri/tauri.release.conf.json"
          }
          npm run tauri build -- --config $config
      - name: Normalize and hash Windows assets
        shell: pwsh
        run: |
          $source = "windows/src-tauri/target/release/bundle/nsis"
          $stage = "windows-release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $installer = @(Get-ChildItem $source -Filter "*-setup.exe")
          $updater = @(Get-ChildItem $source -Filter "*.nsis.zip")
          $signature = @(Get-ChildItem $source -Filter "*.nsis.zip.sig")
          if ($installer.Count -ne 1 -or $updater.Count -ne 1 -or $signature.Count -ne 1) {
            throw "Expected one NSIS installer, updater archive, and updater signature"
          }
          $installerName = "AI-Token-Meter-${env:VERSION}-windows-x64-setup.exe"
          $updaterName = "AI-Token-Meter-${env:VERSION}-windows-x64.nsis.zip"
          Copy-Item $installer[0].FullName "$stage/$installerName"
          Copy-Item $updater[0].FullName "$stage/$updaterName"
          Copy-Item $signature[0].FullName "$stage/$updaterName.sig"
          $hash = (Get-FileHash "$stage/$installerName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content "$stage/$installerName.sha256" -Encoding ascii
      - name: Verify Windows updater signature with the embedded public key
        shell: pwsh
        run: |
          $updater = "windows-release/AI-Token-Meter-${env:VERSION}-windows-x64.nsis.zip"
          cargo run --locked --manifest-path windows/src-tauri/Cargo.toml --example verify_update_signature -- `
            $updater `
            "$updater.sig" `
            "windows/src-tauri/tauri.conf.json"
      - name: Upload signed Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: ai-token-meter-windows-x64-release
          path: windows-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish synchronized release
    needs: [macos-preflight, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - name: Download Windows release assets
        uses: actions/download-artifact@v5
        with:
          name: ai-token-meter-windows-x64-release
          path: windows-build
      - name: Select verified build assets or exact public recovery assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-release
          release_state="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          if [[ "$release_state" == "true" ]]; then
            cp windows-build/* windows-release/
          elif [[ "$release_state" == "false" ]]; then
            installer="AI-Token-Meter-${VERSION}-windows-x64-setup.exe"
            updater="AI-Token-Meter-${VERSION}-windows-x64.nsis.zip"
            gh release download "v$VERSION" --dir windows-release \
              --pattern "$installer" \
              --pattern "$installer.sha256" \
              --pattern "$updater" \
              --pattern "$updater.sig"
          else
            echo "Unable to determine release visibility for v$VERSION" >&2
            exit 1
          fi
      - name: Verify Windows assets and create updater manifest
        shell: bash
        run: |
          set -euo pipefail
          installer="AI-Token-Meter-${VERSION}-windows-x64-setup.exe"
          updater="AI-Token-Meter-${VERSION}-windows-x64.nsis.zip"
          cd windows-release
          sha256sum -c "$installer.sha256"
          test -s "$updater"
          test -s "$updater.sig"
          signature="$(tr -d '\r\n' < "$updater.sig")"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See the GitHub release notes for AI Token Meter $VERSION." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$signature" \
            --arg url "https://github.com/sljzdotcom/AI-Token-Meter/releases/download/v${VERSION}/${updater}" \
            '{version:$version,notes:$notes,pub_date:$pub_date,platforms:{"windows-x86_64":{signature:$signature,url:$url}}}' \
            > latest.json
          jq -e --arg version "$VERSION" '.version == $version and (.platforms["windows-x86_64"].signature | length > 0)' latest.json >/dev/null
      - name: Back up public update feeds before publication
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-feed-utils.sh
          backup_dir="$RUNNER_TEMP/release-feed-backup"
          mkdir -p "$backup_dir"
          release_state="$(gh release view "v$VERSION" --json isDraft --jq .isDraft)"
          [[ "$release_state" == "true" || "$release_state" == "false" ]]
          printf '%s\n' "$release_state" > "$backup_dir/target-release-was-draft"
          git fetch origin main
          git show origin/main:appcast.xml > "$backup_dir/prior-appcast.xml"
          preview_state="$(probe_github_release windows-preview-feed "$backup_dir/probes")"
          printf '%s\n' "$preview_state" > "$backup_dir/preview-feed-state"
          if [[ "$preview_state" == "present" ]]; then
            gh release download windows-preview-feed \
              --dir "$backup_dir/preview-download" \
              --pattern latest-preview.json
            mv "$backup_dir/preview-download/latest-preview.json" \
              "$backup_dir/prior-preview-feed.json"
          fi
      - name: Upload Windows assets and publish the verified draft
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/release-feed-backup"
          release_state="$(cat "$backup_dir/target-release-was-draft")"
          if [[ "$release_state" == "true" ]]; then
            gh release upload "v$VERSION" windows-release/* --clobber
            touch "$backup_dir/publication-attempted"
            gh release edit "v${VERSION}" --draft=false
          elif [[ "$release_state" == "false" ]]; then
            assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            installer="AI-Token-Meter-${VERSION}-windows-x64-setup.exe"
            updater="AI-Token-Meter-${VERSION}-windows-x64.nsis.zip"
            for expected in "$installer" "$installer.sha256" "$updater" "$updater.sig" latest.json; do
              grep -Fxq "$expected" <<<"$assets"
            done
          else
            echo "Unable to determine release visibility for v$VERSION" >&2
            exit 1
          fi
      - name: Publish the stable macOS appcast after assets are public
        if: ${{ !contains(inputs.version, '-preview.') }}
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/release-feed-backup"
          feed_dir="$RUNNER_TEMP/stable-appcast"
          mkdir -p "$feed_dir"
          gh release download "v$VERSION" --dir "$feed_dir" --pattern appcast.xml
          touch "$backup_dir/stable-feed-update-attempted"
          git fetch origin main
          git checkout -B main origin/main
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          cp "$feed_dir/appcast.xml" appcast.xml
          if git diff --quiet -- appcast.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release: publish appcast v$VERSION"
          git push origin HEAD:main
      - name: Update the fixed Windows preview feed after assets are public
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-feed-utils.sh
          backup_dir="$RUNNER_TEMP/release-feed-backup"
          cp windows-release/latest.json windows-release/latest-preview.json
          preview_state="$(probe_github_release windows-preview-feed "$backup_dir/update-probes")"
          touch "$backup_dir/preview-feed-update-attempted"
          if [[ "$preview_state" == "present" ]]; then
            gh release upload windows-preview-feed windows-release/latest-preview.json --clobber
          else
            gh release create windows-preview-feed \
              --prerelease \
              --title "Windows preview update feed" \
              --notes "Machine-readable update feed for AI Token Meter Windows preview builds." \
              windows-release/latest-preview.json
          fi
      - name: Rollback public update feeds and release visibility
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release-feed-utils.sh
          backup_dir="$RUNNER_TEMP/release-feed-backup"
          rollback_failed=0

          if [[ -f "$backup_dir/stable-feed-update-attempted" ]]; then
            if [[ ! -s "$backup_dir/prior-appcast.xml" ]]; then
              rollback_failed=1
            fi
            git fetch origin main || rollback_failed=1
            git checkout -B main origin/main || rollback_failed=1
            cp "$backup_dir/prior-appcast.xml" appcast.xml || rollback_failed=1
            if [[ "$rollback_failed" == 0 ]] && ! git diff --quiet -- appcast.xml; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add appcast.xml
              git commit -m "release: rollback appcast v$VERSION" || rollback_failed=1
              git push origin HEAD:main || rollback_failed=1
            fi
          fi

          if [[ -f "$backup_dir/preview-feed-update-attempted" ]]; then
            preview_state="$(cat "$backup_dir/preview-feed-state")"
            if [[ "$preview_state" == "present" && -s "$backup_dir/prior-preview-feed.json" ]]; then
              rollback_dir="$RUNNER_TEMP/preview-feed-rollback"
              mkdir -p "$rollback_dir"
              cp "$backup_dir/prior-preview-feed.json" "$rollback_dir/latest-preview.json"
              gh release upload windows-preview-feed "$rollback_dir/latest-preview.json" --clobber \
                || rollback_failed=1
            elif [[ "$preview_state" == "absent" ]]; then
              current_preview_state="unknown"
              if ! current_preview_state="$(probe_github_release windows-preview-feed "$backup_dir/rollback-probes")"; then
                rollback_failed=1
              elif [[ "$current_preview_state" == "present" ]]; then
                gh release delete windows-preview-feed --yes --cleanup-tag || rollback_failed=1
              fi
            elif [[ "$preview_state" != "absent" ]]; then
              rollback_failed=1
            fi
          fi

          if [[ -f "$backup_dir/publication-attempted" ]]; then
            feeds_safe=1
            stable_now="$backup_dir/current-appcast.xml"
            if ! git fetch origin main \
              || ! git show origin/main:appcast.xml > "$stable_now" \
              || grep -Fq "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" "$stable_now"; then
              feeds_safe=0
            fi

            current_preview_state="unknown"
            if ! current_preview_state="$(probe_github_release windows-preview-feed "$backup_dir/verify-probes")"; then
              feeds_safe=0
            elif [[ "$current_preview_state" == "present" ]]; then
              verify_dir="$RUNNER_TEMP/preview-feed-verification"
              mkdir -p "$verify_dir"
              if ! gh release download windows-preview-feed \
                --dir "$verify_dir" --pattern latest-preview.json --clobber \
                || ! jq -e --arg version "$VERSION" '.version != $version' \
                  "$verify_dir/latest-preview.json" >/dev/null; then
                feeds_safe=0
              fi
            fi

            if release_may_return_to_draft "$backup_dir" "$rollback_failed" "$feeds_safe"; then
              gh release edit "v${VERSION}" --draft=true || rollback_failed=1
            else
              echo "Keeping v${VERSION} public because update-feed recovery is not proven safe." >&2
              rollback_failed=1
            fi
          fi
          exit "$rollback_failed"
