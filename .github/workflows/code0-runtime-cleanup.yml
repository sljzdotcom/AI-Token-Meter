name: Code0 isolated runtime terminal-join GREEN

on:
  push:
    branches: [codex/code0-runtime-cleanup-20261029]

permissions:
  contents: read

concurrency:
  group: code0-runtime-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-cleanup:
    name: Complete253 library GREEN with joined worker negative control
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Select byte-stable isolated checkout
        shell: python {0}
        run: |
          import os
          if (os.name != 'nt' or os.environ.get('GITHUB_ACTIONS') != 'true'
                  or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'
                  or os.environ.get('GITHUB_EVENT_NAME') != 'push'
                  or os.environ.get('GITHUB_REF') != 'refs/heads/codex/code0-runtime-cleanup-20261029'):
              raise SystemExit('Runtime candidate requires the exact hosted Windows push')
          if any(key == 'GIT_CONFIG_COUNT' or key == 'GIT_CONFIG_PARAMETERS'
                 or key.startswith(('GIT_CONFIG_KEY_', 'GIT_CONFIG_VALUE_'))
                 for key in os.environ):
              raise SystemExit('Unexpected inherited Git runtime settings')
          entries = ('GIT_CONFIG_COUNT=2', 'GIT_CONFIG_KEY_0=core.autocrlf',
                     'GIT_CONFIG_VALUE_0=false', 'GIT_CONFIG_KEY_1=core.eol',
                     'GIT_CONFIG_VALUE_1=lf')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='\n') as output:
              output.write('\n'.join(entries) + '\n')
      - name: Check out the exact auxiliary candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify sole8721 parent three changed paths and all nine payload bytes
        shell: python {0}
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          base = '8721b1a4f9242fb74508852eb1804838249134ce'
          expected = {
              "windows/src-tauri/src/platform/windows/code0_runtime.rs": {
                  "bytes": 130198,
                  "sha256": "2dd5e09d18ece874e2dd4b8457c1353871d50a2c83cabe1fb1d986980ce67d96"
              },
              "windows/src-tauri/src/platform/windows/code0_web_session.rs": {
                  "bytes": 75055,
                  "sha256": "1a0857640a2f82f623dc54d3dcb7988e572b9951c8f6adc5fa7bf837f3e4190e"
              },
              "windows/src-tauri/src/platform/windows/code0_dispatcher.rs": {
                  "bytes": 49237,
                  "sha256": "1ce7229523ee0f010ecc198b2d9e8d24188be8dc9ac3c0f9dd7539bd80ce4355"
              },
              "windows/src-tauri/src/platform/windows/mod.rs": {
                  "bytes": 783,
                  "sha256": "fdc52b30b4cfc5f0d70b0c3fb8a34776da5495cb85c7f7253e9853cd3c89dc71"
              },
              "windows/src-tauri/src/platform/windows/code0_tick.rs": {
                  "bytes": 7059,
                  "sha256": "67cf56cea36efb5506cab969c05919c87101d5f3609e929b75dcd3fcae692e06"
              },
              "windows/src-tauri/src/platform/windows/code0_clock.rs": {
                  "bytes": 13231,
                  "sha256": "a1a4760d4573c6f268a84ce3ab18fcd9ca0d80a78fab5df8d75fad46ee5ec84a"
              },
              "windows/src-tauri/Cargo.toml": {
                  "bytes": 2343,
                  "sha256": "1a0ea68c77ee338d128d791018c5b378c6781b857b522bb483156d8d57fe017e"
              },
              "scripts/test-code0-runtime-cleanup.py": {
                  "bytes": 52299,
                  "sha256": "82f92c15575090524b7248ca5c2bc14527e147a8a8f489930c764d8eaea302bd"
              }
          }
          workflow = '.github/workflows/code0-runtime-cleanup.yml'
          expected_changes = [['M', '.github/workflows/code0-runtime-cleanup.yml'], ['M', 'scripts/test-code0-runtime-cleanup.py'], ['M', 'windows/src-tauri/src/platform/windows/code0_runtime.rs']]
          run, attempt, sha = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA'))
          if (re.fullmatch(r'[0-9]{1,20}', run) is None
                  or re.fullmatch(r'[0-9]{1,6}', attempt) is None
                  or re.fullmatch(r'[0-9a-f]{40}', sha) is None):
              raise SystemExit('Invalid runtime source identity')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], text=True).split()
          changes = [line.split('\t') for line in subprocess.check_output(
              ['git', 'diff-tree', '--no-commit-id', '--name-status', '-r', base, 'HEAD'], text=True).splitlines()]
          if actual != sha or parents != [actual, base] or sorted(changes) != expected_changes:
              raise SystemExit('Runtime terminal/join checkout is not the exact three-path e501 child')
          observed = {}
          for name in sorted(set(expected) | {workflow}):
              raw = Path(name).read_bytes()
              blob = subprocess.check_output(['git', 'show', 'HEAD:' + name])
              mode = subprocess.check_output(['git', 'ls-tree', 'HEAD', '--', name], text=True).split()[0]
              observed[name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              if raw != blob or mode != '100644' or (name in expected and observed[name] != expected[name]):
                  raise SystemExit('Runtime payload bytes or mode differ')
          out = Path(os.environ['RUNNER_TEMP']) / f'code0-runtime-terminal-join-green-{run}-{attempt}'
          out.mkdir(exist_ok=False)
          host_keys = ('RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_NAME', 'RUNNER_ENVIRONMENT',
                       'ImageOS', 'ImageVersion', 'ACTIONS_RUNNER_VERSION')
          host = {key: os.environ.get(key) for key in host_keys}
          if any(value is not None and len(value) > 2048 for value in host.values()):
              raise SystemExit('Oversize runner identity')
          identity = {'schema': 1, 'runId': run, 'attempt': attempt, 'checkout': actual,
                      'parent': base, 'ref': os.environ['GITHUB_REF'], 'event': os.environ['GITHUB_EVENT_NAME'],
                      'repository': os.environ.get('GITHUB_REPOSITORY'),
                      'workflowRef': os.environ.get('GITHUB_WORKFLOW_REF'),
                      'changes': changes, 'payloads': observed, 'runnerHost': host}
          encoded = json.dumps(identity, indent=2) + '\n'
          if len(encoded.encode('utf-8')) > 16384:
              raise SystemExit('Oversize runtime source binding')
          with (out / 'identity.json').open('x', encoding='utf-8', newline='\n') as output:
              output.write(encoded)
          print(encoded)
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci
      - name: Build frontend resources
        working-directory: windows
        run: npm run build
      - name: Check candidate formatting
        working-directory: windows/src-tauri
        run: cargo fmt --check
      - name: Require strict build then complete253 library exact terminal-join GREEN
        shell: python {0}
        run: |
          import hashlib, json, os, subprocess, sys, time
          from pathlib import Path
          run, attempt = (os.environ[key] for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
          out = Path(os.environ['RUNNER_TEMP']) / f'code0-runtime-terminal-join-green-{run}-{attempt}'
          argv = [sys.executable, 'scripts/test-code0-runtime-cleanup.py']
          result = {'schema': 1, 'runId': run, 'attempt': attempt,
                    'checkout': os.environ['GITHUB_SHA'], 'argv': argv,
                    'exitCode': None, 'collectorReaped': False,
                    'collectorElapsedSeconds': None, 'error': 'none'}
          stdout_path, stderr_path = out / 'collector.stdout.log', out / 'collector.stderr.log'
          try:
              with stdout_path.open('xb') as stdout, stderr_path.open('xb') as stderr:
                  collector_started = time.monotonic()
                  child = subprocess.Popen(argv, stdin=subprocess.DEVNULL,
                                           stdout=stdout, stderr=stderr, shell=False)
                  result['exitCode'] = child.wait()
                  result['collectorElapsedSeconds'] = time.monotonic() - collector_started
                  result['collectorReaped'] = True
                  if result['collectorElapsedSeconds'] >= 1500:
                      result['error'] = 'collector_total_deadline'
              if any(path.stat().st_size > 4194304 for path in (stdout_path, stderr_path)):
                  result['error'] = 'collector_output_overflow'
              else:
                  result['logs'] = {path.name: {'bytes': path.stat().st_size,
                                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                                    for path in (stdout_path, stderr_path)}
          except OSError as error:
              result['error'] = type(error).__name__
          finally:
              with (out / 'collector-exit.json').open('x', encoding='utf-8', newline='\n') as output:
                  json.dump(result, output, indent=2)
                  output.write('\n')
          print(json.dumps(result, indent=2))
          if (result['exitCode'] != 0 or not result['collectorReaped']
                  or result['error'] != 'none'
                  or result['collectorElapsedSeconds'] is None
                  or result['collectorElapsedSeconds'] >= 1500):
              raise SystemExit('Runtime terminal/join collector did not return exact GREEN evidence')
      - name: Preserve complete source gates and exact runtime terminal-join GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-runtime-terminal-join-green-evidence
          path: ${{ runner.temp }}/code0-runtime-terminal-join-green-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
