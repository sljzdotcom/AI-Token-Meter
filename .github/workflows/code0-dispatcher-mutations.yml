name: Code0 dispatcher mutation contracts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/code0-dispatcher-mutations.yml
      - scripts/test-code0-dispatcher-mutations.py
      - windows/src-tauri/src/platform/windows/code0_dispatcher.rs
      - windows/src-tauri/tests/code0_dispatcher.rs
      - windows/src-tauri/Cargo.toml
      - windows/src-tauri/Cargo.lock
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/code0-dispatcher-mutations.yml
      - scripts/test-code0-dispatcher-mutations.py
      - windows/src-tauri/src/platform/windows/code0_dispatcher.rs
      - windows/src-tauri/tests/code0_dispatcher.rs
      - windows/src-tauri/Cargo.toml
      - windows/src-tauri/Cargo.lock

permissions:
  contents: read

concurrency:
  group: code0-dispatcher-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    name: Four Code0 dispatcher semantic mutations
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Select byte-stable Git settings before checkout
        shell: python {0}
        run: |
          import os

          if (os.name != 'nt' or os.environ.get('GITHUB_ACTIONS') != 'true'
                  or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'):
              raise SystemExit('Byte-stable checkout requires the ephemeral Windows job')
          if any(key == 'GIT_CONFIG_COUNT' or key == 'GIT_CONFIG_PARAMETERS'
                 or key.startswith(('GIT_CONFIG_KEY_', 'GIT_CONFIG_VALUE_'))
                 for key in os.environ):
              raise SystemExit('Unexpected inherited Git runtime configuration; refusing replacement')
          entries = (
              'GIT_CONFIG_COUNT=2',
              'GIT_CONFIG_KEY_0=core.autocrlf',
              'GIT_CONFIG_VALUE_0=false',
              'GIT_CONFIG_KEY_1=core.eol',
              'GIT_CONFIG_VALUE_1=lf',
          )
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline=chr(10)) as output:
              output.write(chr(10).join(entries) + chr(10))
          print('Byte-stable Git settings selected for this job; raw source guards remain required.')
      - name: Check out source
        uses: actions/checkout@v5
      - name: Record exact dispatcher checkout bytes
        shell: python {0}
        run: |
          import hashlib, json, os, re, stat, subprocess, time
          from pathlib import Path

          expected = {
              'scripts/test-code0-dispatcher-mutations.py': '335acee5deea8106e6d27d2d341a7be1ff3e7d630ae024b9f8f693658396b74a',
              'windows/src-tauri/src/platform/windows/code0_dispatcher.rs': 'e83882b31e1ee7ce7e9e999e70c2733822a488d5e01dc0ca0ec82b0cd98eb9ab',
              'windows/src-tauri/tests/code0_dispatcher.rs': 'b736e324815a8e838881e0592c79c74f422bb872534b44248813088863921305',
          }
          def plain(path, directory=False):
              for item in (path, *path.parents):
                  info = item.lstat()
                  if info.st_file_attributes & stat.FILE_ATTRIBUTE_REPARSE_POINT:
                      raise ValueError('linked diagnostic input')
              if not (path.is_dir() if directory else path.is_file()):
                  raise ValueError('diagnostic path kind')
              return path

          def bounded(path, limit):
              plain(path)
              with path.open('rb') as source:
                  raw = source.read(limit + 1)
              if len(raw) > limit:
                  raise ValueError('diagnostic input exceeds bound')
              return raw

          def git(args, limit=16384):
              if runtime['processUnreaped']:
                  raise ValueError('git_not_reaped_no_next_command')
              if time.monotonic() >= deadline:
                  raise ValueError('diagnostic_total_deadline')
              runtime['commandsStarted'] += 1
              if runtime['commandsStarted'] > 20:
                  raise ValueError('diagnostic_command_limit')
              label = f"git-{runtime['commandsStarted']:02d}"
              stdout_path, stderr_path = tools / (label + '.stdout'), tools / (label + '.stderr')
              end = min(deadline, time.monotonic() + 30)
              with stdout_path.open('xb') as stdout, stderr_path.open('xb') as stderr:
                  child = subprocess.Popen(['git', *args], stdin=subprocess.DEVNULL,
                                           stdout=stdout, stderr=stderr, shell=False)
                  runtime['processUnreaped'] = True
                  while child.poll() is None:
                      if (time.monotonic() >= end or stdout_path.stat().st_size > limit
                              or stderr_path.stat().st_size > 16384):
                          raise ValueError('active_git_deadline_or_overflow')
                      time.sleep(0.05)
                  result = child.wait()
                  runtime['processUnreaped'] = False
              if time.monotonic() >= end:
                  raise ValueError('git_completed_after_deadline')
              # Read only after observed exit, explicit reap and closure; never signal or
              # digest active files. A blocked spawn/FS or unknown child can exceed a bound.
              output, error = bounded(stdout_path, limit), bounded(stderr_path, 16384)
              if time.monotonic() >= deadline:
                  raise ValueError('diagnostic_total_deadline')
              if result not in (0, 1):
                  raise ValueError('diagnostic_git_command_failed')
              return result, output

          def identity(raw):
              return dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest(),
                          lf=raw.count(bytes([10])), crlf=raw.count(bytes([13, 10])),
                          loneCr=raw.count(bytes([13]))-raw.count(bytes([13, 10])))

          if (os.name != 'nt' or os.environ.get('GITHUB_ACTIONS') != 'true'
                  or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted'):
              raise SystemExit('Checkout-byte diagnostics require the ephemeral Windows job')
          run = os.environ.get('GITHUB_RUN_ID', '')
          attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '')
          if not re.fullmatch(r'[0-9]{1,20}', run) or not re.fullmatch(r'[0-9]{1,6}', attempt):
              raise SystemExit('Invalid diagnostic run identity')
          root = plain(Path(os.environ['GITHUB_WORKSPACE']), directory=True)
          if Path.cwd() != root:
              raise SystemExit('Unexpected diagnostic workspace')
          temporary = plain(Path(os.environ['RUNNER_TEMP']), directory=True)
          destination = temporary / f'code0-dispatcher-checkout-{run}-{attempt}.json'
          if destination.exists() or destination.is_symlink():
              raise SystemExit('Refusing existing checkout diagnostic')
          tools = temporary / f'code0-dispatcher-checkout-tools-{run}-{attempt}'
          if tools.exists() or tools.is_symlink():
              raise SystemExit('Refusing existing diagnostic tool directory')
          tools.mkdir(mode=0o700)
          runtime = dict(processUnreaped=False, commandsStarted=0)
          deadline = time.monotonic() + 120
          evidence = dict(schema=1, kind='checkout_bytes_only', runId=run, runAttempt=attempt,
                          githubSha=os.environ.get('GITHUB_SHA'), actualHead=None, actualParents=[],
                          prHeadSha=None, prMergeSha=None, status='incomplete', files=[], config=[], attributes=None,
                          mutationBaseline='unrun', semanticKills=0)
          try:
              code, raw = git(['rev-parse', '--verify', 'HEAD'])
              head = raw.decode('ascii').strip()
              if code or not re.fullmatch(r'[0-9a-f]{40}', head):
                  raise ValueError('Invalid checkout HEAD')
              evidence['actualHead'] = head
              code, size = git(['cat-file', '-s', head])
              if code or not size.strip().isdigit() or int(size) > 65536:
                  raise ValueError('Raw commit exceeds metadata bound')
              code, commit = git(['cat-file', 'commit', head], 65536)
              if code or len(commit) != int(size):
                  raise ValueError('Raw commit metadata incomplete')
              # Literal object headers retain real parents even at a shallow boundary.
              header = commit.split(bytes([10, 10]), 1)[0]
              parents = [line[7:].decode('ascii') for line in header.splitlines() if line.startswith(b'parent ')]
              if len(parents) > 8 or any(re.fullmatch(r'[0-9a-f]{40}', parent) is None for parent in parents):
                  raise ValueError('Raw parent metadata invalid')
              evidence['actualParents'] = parents
              evidence['actualParentsSource'] = 'literal_raw_commit_headers'
              event = json.loads(bounded(Path(os.environ['GITHUB_EVENT_PATH']), 1048576))
              pr = event.get('pull_request', {})
              for key, value in (('prHeadSha', pr.get('head', {}).get('sha')),
                                 ('prMergeSha', pr.get('merge_commit_sha'))):
                  if isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value):
                      evidence[key] = value
              matches = True
              for name, accepted in expected.items():
                  working = bounded(root / name, 1048576)
                  code, size = git(['cat-file', '-s', f'{head}:{name}'])
                  if code or not size.strip().isdigit() or int(size) > 1048576:
                      raise ValueError('Committed diagnostic input exceeds bound')
                  code, committed = git(['cat-file', 'blob', f'{head}:{name}'], 1048576)
                  if code or len(committed) != int(size):
                      raise ValueError('Committed diagnostic input incomplete')
                  row = dict(path=name, acceptedSha256=accepted, working=identity(working), committed=identity(committed))
                  row['exactMatch'] = row['working']['sha256'] == accepted == row['committed']['sha256']
                  evidence['files'].append(row)
                  matches = matches and row['exactMatch']
              for key in ('core.autocrlf', 'core.eol', 'core.attributesfile'):
                  code, value = git(['config', '--show-origin', '--show-scope', '--get', key])
                  evidence['config'].append(dict(key=key, present=code == 0, value=value.decode('utf-8', 'strict').strip() if code == 0 else None))
              code, attrs = git(['check-attr', '-z', 'text', 'eol', 'filter', 'working-tree-encoding', 'export-ignore', 'export-subst', '--', *expected])
              if code:
                  raise ValueError('Effective source attributes unavailable')
              evidence['attributes'] = attrs.decode('utf-8', 'strict').split(chr(0))
              evidence['status'] = 'exact_bytes_match' if matches else 'raw_byte_mismatch'
          except Exception as error:
              evidence['errorType'] = type(error).__name__
          evidence['processUnreaped'] = runtime['processUnreaped']
          evidence['commandsStarted'] = runtime['commandsStarted']
          evidence['limits'] = dict(totalCooperativeSeconds=120, gitCooperativeSeconds=30,
                                    stderrBytes=16384, maximumStdoutBytes=1048576,
                                    privateToolFilesNotUploaded=True,
                                    unknownActiveProcessDiskGrowthBounded=False)
          if runtime['processUnreaped'] or time.monotonic() >= deadline:
              evidence['status'] = 'incomplete'
          raw = (json.dumps(evidence, indent=2) + chr(10)).encode('utf-8')
          if len(raw) > 262144:
              raise SystemExit('Checkout diagnostic output exceeds bound')
          with destination.open('xb') as output:
              output.write(raw)
          print('Checkout-byte metadata retained; no baseline or mutation acceptance implied.')
          if evidence['status'] != 'exact_bytes_match' or time.monotonic() >= deadline:
              raise SystemExit('Checkout bytes are not the reviewed committed source; mutation opt-in refused')
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci
      - name: Build frontend resources for isolated copies
        working-directory: windows
        run: npm run build
      - name: Fetch locked dependencies before offline mutation checks
        working-directory: windows/src-tauri
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Verify baseline and four fixed semantic mutations
        shell: pwsh
        run: |
          $reviewedHash = '335acee5deea8106e6d27d2d341a7be1ff3e7d630ae024b9f8f693658396b74a'
          if ((Get-FileHash scripts/test-code0-dispatcher-mutations.py -Algorithm SHA256).Hash.ToLowerInvariant() -ne $reviewedHash) { throw 'Unreviewed dispatcher mutation runner' }
          $env:CODE0_DISPATCHER_MUTATIONS_APPROVED = 'otherwise-GREEN25'
          python scripts/test-code0-dispatcher-mutations.py
      - name: Verify complete mutation evidence
        shell: python {0}
        run: |
          import hashlib, json, os
          from pathlib import Path

          script = Path('scripts/test-code0-dispatcher-mutations.py')
          if hashlib.sha256(script.read_bytes()).hexdigest() != '335acee5deea8106e6d27d2d341a7be1ff3e7d630ae024b9f8f693658396b74a':
              raise SystemExit('Unreviewed dispatcher mutation runner')
          candidates = list(Path(os.environ['RUNNER_TEMP']).glob('code0-dispatcher-mutations-*/summary.json'))
          if len(candidates) != 1:
              raise SystemExit('Expected one fresh dispatcher mutation summary')
          with candidates[0].open('rb') as source:
              raw = source.read(524289)
          if len(raw) > 524288:
              raise SystemExit('Mutation summary exceeds bound')
          evidence = json.loads(raw)
          baseline = evidence.get('baseline', {})
          mutants = evidence.get('mutants', [])
          if (type(evidence.get('schema')) is not int or evidence['schema'] != 1
                  or evidence.get('status') != 'passed' or evidence.get('error') != 'none'
                  or evidence.get('checkoutSha') != os.environ['GITHUB_SHA']
                  or evidence.get('githubSha') != os.environ['GITHUB_SHA']
                  or evidence.get('feature') != 'code0-native-fixture'
                  or evidence.get('baselineGreen') is not True
                  or evidence.get('processUnreaped') is not False
                  or evidence.get('cleanup') != 'passed'
                  or evidence.get('enumerationErrorOracle') != 'passed'
                  or evidence.get('historicalPathOracle') != 'passed'
                  or any(baseline.get(p) != 'passed' for p in ('clippy', 'compile', 'integration', 'private', 'cleanup'))
                  or baseline.get('validatedIntegrationTests') != 23 or baseline.get('validatedPrivateTests') != 2
                  or [m.get('id') for m in mutants] != ['M1', 'M2', 'M3', 'M4']
                  or any(m.get('status') != 'killed' or m.get('clippy') != 'passed'
                         or m.get('compile') != 'passed' or m.get('test') != 'semantic_failure'
                         or m.get('semanticAssertionMatch') is not True or m.get('cleanup') != 'passed'
                         or m.get('validatedSelectedTests') != 1 or m.get('validatedFailedTests') != 1
                         for m in mutants)):
              raise SystemExit('Dispatcher mutation evidence incomplete or not GREEN')
          print('Dispatcher baseline25 and four semantic mutation kills verified; no native acceptance implied.')
      - name: Preserve bounded mutation summaries and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-dispatcher-mutation-evidence
          path: |
            ${{ runner.temp }}/code0-dispatcher-mutations-*/summary.json
            ${{ runner.temp }}/code0-dispatcher-mutations-*/*.log
            ${{ runner.temp }}/code0-dispatcher-mutations-*/M*.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve dispatcher checkout-byte diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-dispatcher-checkout-bytes
          path: ${{ runner.temp }}/code0-dispatcher-checkout-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
