                  raise ValueError('N3 parser accepted invalid JSON DATA')
              raw = json.dumps(canary).replace('"scriptCompletions": 1', '"scriptCompletions": 1, "scriptCompletions": 1').encode('utf-8')
              try:
                  decode(raw)
              except ValueError:
                  pass
              else:
                  raise ValueError('N3 parser accepted nested duplicate DATA')
          if __name__ == '__main__':
              try:
                  data_self_check()
                  run_id = f"code0-policy-n3-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
                  base = Path(os.environ['RUNNER_TEMP'])
                  validate(read(base / f'{run_id}.json'), read(base / f'{run_id}-exit.json'), run_id)
              except (OSError, ValueError, TypeError, AttributeError, UnicodeError):
                  raise SystemExit('Code0 N3 setup, target, native action, session failure, schema, exit or cleanup failed; uncovered is not PASS or target RED') from None
              print('Code0 N3 native dialog refusal GREEN; subsequent events and production integration remain unverified.')
