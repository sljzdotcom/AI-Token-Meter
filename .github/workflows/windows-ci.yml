                      'binding': dict.fromkeys(('requestMatched', 'generationMatched',
                                               'coreMatched', 's2InstallMatched',
                                               'guardInstallMatched', 'postDropCurrent'), True),
                      'install': {
                          'core22QuerySucceeded': True, 'guardAdds': 1, 'guardRemoves': 1,
                          'filterAdds': 1, 'filterRemoves': 1, 'completedAdds': 1,
