      - name: Preserve Code0 native owned-loopback HTTP401 refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-windows-policy-http401
          path: |
            ${{ runner.temp }}/code0-policy-http401-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/code0-policy-http401-${{ github.run_id }}-${{ github.run_attempt }}-exit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build Windows NSIS installer
        working-directory: windows
        run: npm run tauri build -- --debug
      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: scripts/check-windows-pe-subsystem.ps1 -Path "windows/src-tauri/target/debug/ai-token-meter-windows.exe"
      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-token-meter-windows-x64-debug-nsis
