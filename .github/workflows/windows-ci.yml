              for raw in (b'{', b'', b'[] trailing', b'{"v":NaN}', b'{"v":Infinity}',
                          b'{"v":-Infinity}', b'{"v":1e999}', b'{"v":1.0}', b'\xff',
                          b'\xef\xbb\xbf{}', b' ' * 8193,
                          b'{"schema":1,"schema":1}', b'{"schema":1,"\\u0073chema":1}',
                          b'{"n":{"a":1,"\\u0061":1}}'):
