                  'capability': capability,
              }

          def validate(data, exit_data, run_id, selector):
              wanted = expected(run_id, selector)
              if type(data) is not dict or type(data.get('lifecycle')) is not dict or type(data.get('capability')) is not dict:
                  raise ValueError('missing evidence object')
              runtime = data['lifecycle'].get('runtimeVersion')
              if type(runtime) is not str or re.fullmatch(r'[0-9.]{1,128}', runtime) is None:
                  raise ValueError('missing actual runtime')
              wanted['lifecycle']['runtimeVersion'] = runtime
              wanted['capability']['runtimeVersion'] = runtime
              if selector != MISSING:
                  ordinals = [data['capability'].get(key) for key in ORDINALS]
                  if any(type(value) is not int or not 1 <= value <= 64 for value in ordinals):
                      raise ValueError('invalid callback ordinal')
                  if not all(left < right for left, right in zip(ordinals, ordinals[1:])):
                      raise ValueError('wrong callback entry order')
                  for key, value in zip(ORDINALS, ordinals):
