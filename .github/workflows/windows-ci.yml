                  d[key] = 1
              d['cdpSubmissions'] = 1 if tag == 'p5' else 0
              return d
          def expected_application(tag):
              return {'scriptIdInventoried': True, 'scriptAcknowledged': tag == 'p5', 'cdpAcknowledged': False}
          def validate_case(raw, expected_run, tag):
              d = decode(raw)
              if type(d) is not dict or set(d) != top:
                  raise ValueError('boundary object schema mismatch')
              for field, expected in (('schema', 3), ('selectedCases', 1), ('completedCases', 1)):
                  if type(d[field]) is not int or d[field] != expected:
                      raise ValueError('boundary version or case count mismatch')
              for field, expected in (('runId', expected_run), ('requiredCase', cases[tag][0]), ('failure', 'none')):
                  if type(d[field]) is not str or d[field] != expected:
                      raise ValueError('boundary identity or completion mismatch')
              if d['pass'] is not True:
                  raise ValueError('boundary case not GREEN')
              install, life, fault = d['install'], d['lifecycle'], d['fault']
              if type(install) is not dict or set(install) != install_counts | install_bools:
                  raise ValueError('install schema mismatch')
              for key, expected in expected_install(tag).items():
                  if key in install_counts:
                      if type(install[key]) is not int or install[key] != expected:
                          raise ValueError('install count mismatch')
                  elif install[key] is not expected:
                      raise ValueError('unexpected install ACK or rejection')
              if type(life) is not dict or set(life) != life_fields:
                  raise ValueError('lifecycle schema mismatch')
              if any(life[key] is not True for key in life_positive) or life['bareWindowViolation'] is not False:
                  raise ValueError('actual native lifecycle missing')
              if type(life['runtimeVersion']) is not str or re.fullmatch(r'[0-9.]{1,128}', life['runtimeVersion']) is None:
                  raise ValueError('runtime version invalid')
              if type(fault) is not dict or set(fault) != fault_counts | {'target'}:
                  raise ValueError('fault schema mismatch')
