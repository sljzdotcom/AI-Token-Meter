          def data_self_check():
              # Catch loss of any old positive predicate or new proof, while pass remains true.
              exit_data = {'schema': 1, 'runId': 'canary', 'exitCode': 0}
              dynamic = {('lifecycle', 'runtimeVersion')}
              dynamic.update(('http401', 'server', key) for key in RANGES)
              dynamic.update(('http401', 'cleanup', key) for key in TIMES)
              for kind in ('top', 'resource'):
                  dynamic.update(('http401', 'postTarget', kind, 'proof', key)
                                 for key in ('entryAtMs', 'settledAtMs'))
