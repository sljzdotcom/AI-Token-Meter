                      or timing['firstCloseAtMs'] > timing['targetAtMs']
                      or timing['targetAtMs'] > timing['finalAtMs']
                      or timing['firstCloseAtMs'] > timing['finalAtMs']
                      or timing['cleanupElapsedMs'] >= 10000
                      or timing['finalAtMs'] - timing['firstCloseAtMs']
                      not in (timing['cleanupElapsedMs'], timing['cleanupElapsedMs'] + 1)):
                  raise ValueError('invalid original timing evidence')
              wanted['http401']['cleanup'].update(timing)
              for kind, count in (('top', top_count), ('resource', resource_count)):
                  row = post[kind]
                  if count == 1:
                      proof = row.get('proof')
                      if type(proof) is not dict:
                          raise ValueError('missing actual refusal proof')
                      entry = integer(proof.get('entryAtMs'), 0, U64_MAX)
                      settled = integer(proof.get('settledAtMs'), 0, U64_MAX)
                      if (not timing['targetAtMs'] <= entry <= settled <= timing['finalAtMs']
                              or entry >= 45000 or settled >= 45000
                              or settled - timing['firstCloseAtMs'] > 10000):
                          raise ValueError('invalid disposal timing evidence')
                      wanted['http401']['postTarget'][kind]['proof'].update({
                          'entryAtMs': entry, 'settledAtMs': settled,
                      })
              # Recursive exact positive shapes enforce both partitions and all crosscounts:
              # active1, invalid/pending0, candidates=qualifiedDisposal0or1, proof null iff0;
              # deliveries=1+qualifiedDisposal=topEvents/resource.total, refused=resource disposal.
              # Rounded values additionally require EVERY precise original-clock/Drop/identity
              # flag true. These producer claims cannot be established by this DATA checker.
              exact(data, wanted)
              exact(exit_data, {'schema': 1, 'runId': run_id, 'exitCode': 0})


          def changed(data, path, value):
              result = copy.deepcopy(data)
              node = result
              for key in path[:-1]:
                  node = node[key]
              node[path[-1]] = value
              return result


          def leaves(value, path=()):
              if type(value) is dict:
                  for key, item in value.items():
                      yield from leaves(item, path + (key,))
              else:
                  yield path, value


          def objects(value, path=()):
              if type(value) is dict:
                  yield path, value
                  for key, item in value.items():
                      yield from objects(item, path + (key,))


          def at(value, path):
              for key in path:
                  value = value[key]
              return value


          def must_reject(data, exit_data):
              try:
                  validate(data, exit_data, 'canary')
              except (ValueError, TypeError, AttributeError):
                  return
              raise ValueError('HTTP401 parser accepted negative DATA')


          def reject_raw(raw):
              try:
                  decode(raw)
              except (ValueError, UnicodeError):
                  return
              raise ValueError('HTTP401 JSON decoder accepted invalid DATA')


          def duplicate_json(value, target, path=(), escaped=False):
              if type(value) is not dict:
                  return json.dumps(value, separators=(',', ':'))
              entries = [(json.dumps(key), duplicate_json(item, target, path + (key,), escaped))
                         for key, item in value.items()]
              if path == target:
                  name, encoded = entries[0]
                  if escaped:
                      first = next(iter(value))
                      name = '"\\u%04x%s"' % (ord(first[0]), first[1:])
                  entries.append((name, encoded))
              return '{' + ','.join(key + ':' + item for key, item in entries) + '}'


          # SOURCE definitions only. These call the real inline validate/decode at CI time.
          # No definition or imported candidate code has been executed on the author host.
          CANARY_JSON = '{"schema":16,"runId":"canary","requiredCase":"refusal-http401-owned-loopback","selectedCases":1,"completedCases":1,"pass":true,"failure":"none","install":{"submissions":0,"barrierReceipts":0,"firstLoadReceipts":0,"documentReceipts":0,"submissionAccepted":false,"installRejected":false,"scriptAcknowledged":false,"cdpAcknowledged":false,"sourceMatched":false,"syntheticResponseApplied":false,"canonicalReadyControl":false,"ackBeforeFirstLoad":false},"lifecycle":{"staMain":true,"callbackAffinity":true,"noInheritedOverride":true,"engineReady":true,"bareHiddenUnfocused":true,"constructionObserved":true,"profileIsolated":true,"destroyed":true,"ownedReferencesReleased":true,"runReturned":true,"cleanupSucceeded":true,"bareWindowViolation":false,"runtimeVersion":"1.2.3.4"},"nativeRefusal":{"receipts":1,"nativeInstanceValidated":true,"sourceBoundRegistry":true,"navigationNotIssued":false,"loadRejected":false,"requiredMask":1023,"installedMask":1023,"notInstalledHooks":[]},"http401":{"version":2,"selector":"refusal-http401-owned-loopback","phase":"Closed","unknown":false,"overflow":false,"receipts":{"target":1,"final":1},"binding":{"requestMatched":true,"generationMatched":true,"coreMatched":true,"s2InstallMatched":true,"guardInstallMatched":true,"postDropCurrent":true},"install":{"core22QuerySucceeded":true,"guardAdds":1,"guardRemoves":1,"filterAdds":1,"filterRemoves":1,"completedAdds":1,"completedRemoves":1,"handlersDrained":true},"navigation":{"attempts":1,"topEvents":1,"grants":1,"hresultSucceeded":true,"qualificationMatched":true,"navigationIdReadable":true,"cancelFalse":true},"resource":{"total":1,"passed":1,"refused":0,"exactDocumentGet":true,"qualificationMatched":true},"server":{"startupSucceeded":true,"version22":true,"exclusiveAck":true,"listenerLingerOff":true,"listenerNonblocking":true,"boundEndpointMatched":true,"listenSucceeded":true,"acceptedLocalMatched":true,"acceptedPeerMatched":true,"streamLingerOff":true,"streamNonblocking":true,"requ