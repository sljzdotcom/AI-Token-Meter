      - name: Verify Code0 native owned-empty-HTML dialog refusal evidence
        if: always()
        shell: python
        run: |
          import copy, json, os, re
          from pathlib import Path
          LIFE = ['staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'bareHiddenUnfocused', 'constructionObserved', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded']
          COUNTS = ['submissions', 'barrierReceipts', 'firstLoadReceipts', 'documentReceipts']
          FLAGS = ['submissionAccepted', 'installRejected', 'scriptAcknowledged', 'cdpAcknowledged', 'sourceMatched', 'syntheticResponseApplied', 'canonicalReadyControl', 'ackBeforeFirstLoad']
          DIALOG_TRUE = ['ownedFilePrepared', 'receiptInstallationMatched', 'actionBeforePolicyFailure', 'browserProcessExitedOnce', 'assetBindingValidated', 'initialSourceMatched', 'completedHandlerAdded', 'settingsBeforeDocument', 'navigationSubmissionReturned', 'navigationSubmitOk', 'startUriMatched', 'startSenderMatched', 'startLiveAfterGetters', 'startIdGetterSucceeded', 'startRedirectedGetterSucceeded', 'startNotRedirected', 'startCancelReadbackSucceeded', 'startNotCanceled', 'grantConsumed', 'completedSenderMatched', 'completedIdGetterSucceeded', 'completedSuccessGetterSucceeded', 'completedSuccess', 'navigationIdMatched', 'completedLiveAfterGetters', 'sourceAfterCompleteMatched', 'freshDocument', 'sourceBeforeScriptMatched', 'scriptSubmissionReturned', 'scriptSubmitOk', 'dialogKindAlert', 'dialogMessageMatched', 'dialogUriMatched', 'dialogSenderMatched', 'dialogLiveAfterGetters', 'nonAcceptActionReturned', 'completionIdentityMatched', 'completionHresultSucceeded', 'boundedResultValid', 'fixedResultMatched', 'completionBeforeRelease', 'completionWithinDeadline', 'completionDispositionConsumed', 'completionObligationDrained', 'completionHandlersDrained', 'completedRemoveSucceeded', 'completedSameEmitter']
          DIALOG_ONCE = ['submissionReceipts', 'documentReceipts', 'scriptSubmissionReceipts', 'targetReceipts', 'completionReceipts', 'finalReceipts', 'policyFailures', 'navigationSubmissions', 'navigationStarts', 'navigationCompletions', 'scriptSubmissions', 'dialogEvents', 'scriptCompletions', 'completedRemoveAttempts']
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError('duplicate member')
                  value[key] = item
              return value
          def invalid_constant(_):
              raise ValueError('invalid JSON constant')
          def decode(raw):
              if len(raw) > 8192:
                  raise ValueError('oversize evidence')
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique, parse_constant=invalid_constant, parse_float=invalid_constant)
          def read(path):
              with path.open('rb') as source:
                  return decode(source.read(8193))
          def exact(actual, expected):
              if type(actual) is not type(expected):
                  raise ValueError('wrong evidence type')
              if type(expected) is dict:
                  if set(actual) != set(expected):
                      raise ValueError('wrong evidence fields')
                  for key in expected:
                      exact(actual[key], expected[key])
              elif type(expected) is list:
                  if len(actual) != len(expected):
                      raise ValueError('wrong evidence list')
                  for item, wanted in zip(actual, expected):
                      exact(item, wanted)
              elif actual != expected:
                  raise ValueError('evidence mismatch')
          def expected(run_id):
              return {'schema': 9, 'runId': run_id, 'requiredCase': 'refusal-dialog-owned-empty-html', 'selectedCases': 1, 'completedCases': 1, 'pass': True, 'failure': 'none',
                      'install': {**dict.fromkeys(COUNTS, 0), **dict.fromkeys(FLAGS, False)},
                      'lifecycle': {**dict.fromkeys(LIFE, True), 'bareWindowViolation': False, 'runtimeVersion': '<actual>'},
                      'nativeRefusal': {'receipts': 1, 'nativeInstanceValidated': True, 'sourceBoundRegistry': True, 'requiredMask': 1023, 'installedMask': 1023, 'notInstalledHooks': [], 'navigationNotIssued': False, 'loadRejected': False},
                      'dialogRefusal': {**dict.fromkeys(DIALOG_TRUE, True), **dict.fromkeys(DIALOG_ONCE, 1)}}
          def validate(data, exit_data, run_id):
              wanted = expected(run_id)
              runtime = data.get('lifecycle', {}).get('runtimeVersion') if type(data) is dict else None
              if type(runtime) is not str or re.fullmatch(r'[0-9.]{1,128}', runtime) is None:
                  raise ValueError('missing actual runtime')
              wanted['lifecycle']['runtimeVersion'] = runtime
              exact(data, wanted)
              exact(exit_data, {'schema': 1, 'runId': run_id, 'exitCode': 0})
          def must_reject(data, exit_data):
              try:
                  validate(data, exit_data, 'canary')
              except (ValueError, TypeError, AttributeError):
                  return
              raise ValueError('N3 parser accepted negative DATA')
          def leaves(value, prefix=()):
              if type(value) is dict:
                  for key, item in value.items():
                      yield from leaves(item, prefix + (key,))
              else:
                  yield prefix, value
          def changed(data, path, value):
              result = copy.deepcopy(data)
              node = result
              for key in path[:-1]:
                  node = node[key]
              node[path[-1]] = value
              return result
          def data_self_check():
              # DATA only: never native witnesses. Keep pass=true while each
              # independent setup/event/action/failure/lifecycle fact is broken.
              canary = expected('canary')
              canary['lifecycle']['runtimeVersion'] = '1.2.3.4'
              exit_data = {'schema': 1, 'runId': 'canary', 'exitCode': 0}
              validate(canary, exit_data, 'canary')
              for path, value in leaves(canary):
                  if path == ('pass',):
                      continue
                  replacement = (not value) if type(value) is bool else (value + 1) if type(value) is int else ['extra'] if type(value) is list else 'wrong'
                  must_reject(changed(canary, path, replacement), exit_data)
                  if type(value) is int:
                      must_reject(changed(canary, path, True), exit_data)
                      if value > 0:
                          must_reject(changed(canary, path, 0), exit_data)
              for schema in range(1, 9):
                  must_reject(changed(canary, ('schema',), schema), exit_data)
              for count in (0, 2):
                  for key in ('selectedCases', 'completedCases'):
                      must_reject(changed(canary, (key,), count), exit_data)
              for count in (0, 2):
                  must_reject(changed(canary, ('dialogRefusal', 'targetReceipts'), count), exit_data)
                  must_reject(changed(canary, ('dialogRefusal', 'policyFailures'), count), exit_data)
              for value in (False, 1, [], None):
                  must_reject(value, exit_data)
              for path, _ in leaves(exit_data):
                  must_reject(canary, changed(exit_data, path, True))
              must_reject(canary, {**exit_data, 'exitCode': 1})
              must_reject(canary, {**exit_data, 'runId': 'stale'})
              must_reject(canary, {**exit_data, 'extra': True})
              extra = copy.deepcopy(canary)
              extra['dialogRefusal']['extra'] = True
              must_reject(extra, exit_data)
              missing = copy.deepcopy(canary)
              del missing['dialogRefusal']['fixedResultMatched']
              must_reject(missing, exit_data)
              for key in canary:
                  missing = copy.deepcopy(canary)
                  del missing[key]
                  must_reject(missing, exit_data)
              for group in ('install', 'lifecycle', 'nativeRefusal', 'dialogRefusal'):
                  for key in canary[group]:
                      missing = copy.deepcopy(canary)
                      del missing[group][key]
                      must_reject(missing, exit_data)
                  extra = copy.deepcopy(canary)
                  extra[group]['extra'] = True
                  must_reject(extra, exit_data)
              must_reject({**canary, 'extra': 1}, exit_data)
              must_reject(changed(canary, ('runId',), 'code0-policy-n2-stale'), exit_data)
              for version in ('', 'x', '1' * 129):
