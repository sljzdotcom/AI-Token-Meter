          install_bools = {'submissionAccepted', 'installRejected', 'scriptAcknowledged', 'cdpAcknowledged', 'sourceMatched', 'syntheticResponseApplied', 'canonicalReadyControl', 'ackBeforeFirstLoad'}
          life_positive = {'staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'bareHiddenUnfocused', 'constructionObserved', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded'}
          life_fields = life_positive | {'bareWindowViolation', 'runtimeVersion'}
          fault_counts = {'targetReceipts', 'injectionReceipts', 'prematureLoadDenials', 'navigateAttempts', 'scriptSubmissions', 'cdpSubmissions', 'resourceAdds', 'filterAdds', 'resourceRemovals', 'filterRemovals', 'scriptRemovals', 'policyFailures'}
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate evidence member')
                  result[key] = value
              return result
          def invalid_constant(_):
              raise ValueError('non-JSON evidence number')
          def decode(raw):
              if len(raw) > 8192:
                  raise ValueError('evidence exceeds limit')
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique_object, parse_constant=invalid_constant)
          def expected_install(tag):
              d = {**dict.fromkeys(install_counts, 0), **dict.fromkeys(install_bools, False)}
              d.update(submissions=1, submissionAccepted=True, scriptAcknowledged=tag == 'p5')
              return d
          def expected_fault(tag):
              d = {**dict.fromkeys(fault_counts, 0), 'target': cases[tag][1], 'targetReceipts': 1}
