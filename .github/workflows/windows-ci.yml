name: Windows CI

on:
  push:
    branches: [main, codex/windows-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Windows frontend and Rust runtime
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        shell: pwsh
        run: rustup default 1.88.0
      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci
      - name: Test frontend
        working-directory: windows
        run: npm test
      - name: Verify native bridge resource matches shared source
        run: python scripts/sync-code0-bridge.py --check
      - name: Verify browser density styles
        working-directory: windows
        run: npm run test:density
      - name: Build frontend
        working-directory: windows
        run: npm run build
      - name: Check Rust formatting
        working-directory: windows/src-tauri
        run: cargo fmt --check
      - name: Lint Rust
        id: code0_native_lint
        working-directory: windows/src-tauri
        run: cargo clippy --locked --all-targets --features code0-native-fixture -- -D warnings
      - name: Test Windows runtime
        working-directory: windows/src-tauri
        shell: pwsh
        run: |
          $env:AI_METER_CODE0_NATIVE_RUN_ID = "code0-native-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:AI_METER_CODE0_NATIVE_SUMMARY = Join-Path $env:RUNNER_TEMP "$env:AI_METER_CODE0_NATIVE_RUN_ID.json"
          $env:AI_METER_CODE0_NATIVE_DIAGNOSTICS = "1"
          cargo test --locked --no-fail-fast --features code0-native-fixture
      - name: Collect Code0 fixture loader metadata
        if: always()
        shell: pwsh
        run: ./scripts/collect-code0-native-loader.ps1
      - name: Preserve Code0 fixture loader metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-native-loader-metadata
          path: |
            ${{ runner.temp }}/code0-native-loader-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/code0-native-loader-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
            ${{ runner.temp }}/code0-native-loader-${{ github.run_id }}-${{ github.run_attempt }}/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Code0 native smoke evidence
        if: always()
        shell: python {0}
        run: |
          import json, os, re
          from pathlib import Path

          fields = {'schema', 'runId', 'requiredCase', 'selectedCases', 'completedCases', 'pass', 'failure', 'staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'rendererMessage', 'bareHiddenUnfocused', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded', 'runtimeVersion', 'constructionObserved', 'bareWindowViolation'}
          positive = ('pass', 'staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'rendererMessage', 'bareHiddenUnfocused', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded', 'constructionObserved')

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate evidence member')
                  result[key] = value
              return result

          def invalid_constant(_):
              raise ValueError('non-JSON evidence number')

          def validate(raw, expected_run):
              if len(raw) > 8192:
                  raise ValueError('evidence exceeds limit')
              evidence = json.loads(raw.decode('utf-8'), object_pairs_hook=unique_object, parse_constant=invalid_constant)
              if type(evidence) is not dict or set(evidence) != fields:
                  raise ValueError('evidence object schema mismatch')
              if type(evidence['schema']) is not int or evidence['schema'] != 2:
                  raise ValueError('evidence schema version mismatch')
              for field in ('selectedCases', 'completedCases'):
                  if type(evidence[field]) is not int or evidence[field] != 1:
                      raise ValueError('evidence case count mismatch')
              for field, expected in (('runId', expected_run), ('requiredCase', 'hidden_bare_inline_engine_release'), ('failure', 'none')):
                  if type(evidence[field]) is not str or evidence[field] != expected:
                      raise ValueError('evidence identity or completion mismatch')
              if any(evidence[field] is not True for field in positive) or evidence['bareWindowViolation'] is not False:
                  raise ValueError('positive native evidence missing')
              version = evidence['runtimeVersion']
              if type(version) is not str or re.fullmatch(r'[0-9.]{1,128}', version) is None:
                  raise ValueError('native version evidence invalid')

          # These validate only the evidence parser, never native behavior.
          canary = dict.fromkeys(positive, True)
          canary.update(schema=2, runId='validator-canary', requiredCase='hidden_bare_inline_engine_release', selectedCases=1, completedCases=1, failure='none', runtimeVersion='1.2.3.4', bareWindowViolation=False)
          valid = json.dumps(canary).encode('utf-8')
          validate(valid, 'validator-canary')
          bad_polarity = dict(canary, bareWindowViolation=True)
          for malformed in (b'[' + valid + b']', valid.replace(b'"schema"', b'"Schema"', 1), b'{"schema":2,' + valid[1:], json.dumps(bad_polarity).encode('utf-8')):
              try:
                  validate(malformed, 'validator-canary')
              except ValueError:
                  continue
              raise SystemExit('Code0 evidence validator self-check failed')
          print('Code0 evidence parser self-checks passed; no native acceptance implied.')

          expected_run = f"code0-native-smoke-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          path = Path(os.environ['RUNNER_TEMP']) / f'{expected_run}.json'
          try:
              with path.open('rb') as source:
                  raw = source.read(8193)
              validate(raw, expected_run)
          except (OSError, ValueError, TypeError, UnicodeError):
              raise SystemExit('Code0 native smoke evidence missing, malformed, or not GREEN') from None
          print('Code0 native smoke evidence passed: one required case.')
      - name: Preserve Code0 native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-windows-native-smoke
          path: ${{ runner.temp }}/code0-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test Code0 policy installation barrier
        working-directory: windows/src-tauri
        shell: pwsh
        run: |
          $env:AI_METER_CODE0_POLICY_RUN_ID = "code0-policy-p1-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:AI_METER_CODE0_POLICY_SUMMARY = Join-Path $env:RUNNER_TEMP "$env:AI_METER_CODE0_POLICY_RUN_ID.json"
          $env:AI_METER_CODE0_NATIVE_DIAGNOSTICS = "1"
          cargo test --locked --features code0-native-fixture --test code0_native_fixture -- --code0-policy-fixture=install-ack-before-first-load
      - name: Verify Code0 policy installation evidence
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          top = {'schema', 'runId', 'requiredCase', 'selectedCases', 'completedCases', 'pass', 'failure', 'install', 'lifecycle'}
          counts = {'submissions', 'barrierReceipts', 'firstLoadReceipts', 'documentReceipts'}
          install_positive = {'submissionAccepted', 'scriptAcknowledged', 'cdpAcknowledged', 'sourceMatched', 'syntheticResponseApplied', 'canonicalReadyControl', 'ackBeforeFirstLoad'}
          install_fields = counts | install_positive | {'installRejected'}
          life_positive = {'staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'bareHiddenUnfocused', 'constructionObserved', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded'}
          life_fields = life_positive | {'bareWindowViolation', 'runtimeVersion'}
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate evidence member')
                  result[key] = value
              return result
          def invalid_constant(_):
              raise ValueError('non-JSON evidence number')
          def validate(raw, expected_run):
              if len(raw) > 8192:
                  raise ValueError('evidence exceeds limit')
              d = json.loads(raw.decode('utf-8'), object_pairs_hook=unique_object, parse_constant=invalid_constant)
              if type(d) is not dict or set(d) != top:
                  raise ValueError('policy object schema mismatch')
              for field in ('schema', 'selectedCases', 'completedCases'):
                  if type(d[field]) is not int or d[field] != 1:
                      raise ValueError('policy version or case count mismatch')
              for field, expected in (('runId', expected_run), ('requiredCase', 'install-ack-before-first-load'), ('failure', 'none')):
                  if type(d[field]) is not str or d[field] != expected:
                      raise ValueError('policy identity or completion mismatch')
              if d['pass'] is not True:
                  raise ValueError('policy case not GREEN')
              install, life = d['install'], d['lifecycle']
              if type(install) is not dict or set(install) != install_fields or type(life) is not dict or set(life) != life_fields:
                  raise ValueError('nested policy schema mismatch')
              if any(type(install[k]) is not int or install[k] != 1 for k in counts):
                  raise ValueError('policy required receipt count mismatch')
              if any(install[k] is not True for k in install_positive) or install['installRejected'] is not False:
                  raise ValueError('policy actual ACK or source evidence missing')
              if any(life[k] is not True for k in life_positive) or life['bareWindowViolation'] is not False:
                  raise ValueError('policy actual native lifecycle missing')
              if type(life['runtimeVersion']) is not str or re.fullmatch(r'[0-9.]{1,128}', life['runtimeVersion']) is None:
                  raise ValueError('policy runtime version invalid')
          # Parser canaries only, never native acceptance.
          canary = {'schema': 1, 'runId': 'policy-validator-canary', 'requiredCase': 'install-ack-before-first-load', 'selectedCases': 1, 'completedCases': 1, 'pass': True, 'failure': 'none'}
          canary['install'] = {**dict.fromkeys(counts, 1), **dict.fromkeys(install_positive, True), 'installRejected': False}
          canary['lifecycle'] = {**dict.fromkeys(life_positive, True), 'bareWindowViolation': False, 'runtimeVersion': '1.2.3.4'}
          valid = json.dumps(canary).encode('utf-8')
          validate(valid, 'policy-validator-canary')
          bad_rejection = json.loads(valid)
          bad_rejection['install']['installRejected'] = True
          bad_count = json.loads(valid)
          bad_count['install']['submissions'] = True
          bad_extra = json.loads(valid)
          bad_extra['lifecycle']['extra'] = True
          for malformed in (b'[' + valid + b']', b'{"schema":1,' + valid[1:], json.dumps(bad_rejection).encode(), json.dumps(bad_count).encode(), json.dumps(bad_extra).encode()):
              try:
                  validate(malformed, 'policy-validator-canary')
              except ValueError:
                  continue
              raise SystemExit('Code0 policy parser self-check failed')
          print('Code0 policy parser self-checks passed; no native acceptance implied.')
          expected_run = f"code0-policy-p1-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          path = Path(os.environ['RUNNER_TEMP']) / f'{expected_run}.json'
          try:
              with path.open('rb') as source:
                  raw = source.read(8193)
              validate(raw, expected_run)
          except (OSError, ValueError, TypeError, UnicodeError):
              raise SystemExit('Code0 policy P1 evidence missing, malformed, or not GREEN') from None
          print('Code0 policy P1 evidence passed: one required case.')
      - name: Preserve Code0 policy installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-windows-policy-p1
          path: ${{ runner.temp }}/code0-policy-p1-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test Code0 synchronous install boundaries
        working-directory: windows/src-tauri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $cases = @(
            @{ tag = "p0"; id = "install-premature-load-denied" },
            @{ tag = "p2"; id = "install-setting-injected-failure" },
            @{ tag = "p3"; id = "install-add-injected-failure" },
            @{ tag = "p9"; id = "install-filter-injected-failure" }
          )
          $records = [System.Collections.Generic.List[object]]::new()
          $failed = $false
          foreach ($case in $cases) {
            $env:AI_METER_CODE0_POLICY_RUN_ID = "code0-policy-$($case.tag)-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $env:AI_METER_CODE0_POLICY_SUMMARY = Join-Path $env:RUNNER_TEMP "$env:AI_METER_CODE0_POLICY_RUN_ID.json"
            $env:AI_METER_CODE0_NATIVE_DIAGNOSTICS = "1"
            & cargo test --locked --features code0-native-fixture --test code0_native_fixture -- "--code0-policy-fixture=$($case.id)"
            $code = $LASTEXITCODE
            $records.Add([ordered]@{ tag = $case.tag; requiredCase = $case.id; exitCode = [int]$code })
            if ($code -ne 0) { $failed = $true }
          }
          $runId = "code0-policy-sync-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $exitPath = Join-Path $env:RUNNER_TEMP "$runId-exits.json"
          $payload = [ordered]@{ schema = 1; runId = $runId; cases = @($records.ToArray()) } | ConvertTo-Json -Depth 5 -Compress
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($payload)
          $stream = [System.IO.File]::Open($exitPath, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.Write($bytes, 0, $bytes.Length); $stream.Flush($true) } finally { $stream.Dispose() }
          if ($failed) { exit 1 }
      - name: Verify Code0 synchronous install evidence
        if: always()
        shell: python
        run: |
          import copy
          import json
          import os
          from pathlib import Path
          import re
          cases = {
              'p0': ('install-premature-load-denied', 'premature-load'),
              'p2': ('install-setting-injected-failure', 'host-objects-setting'),
              'p3': ('install-add-injected-failure', 'resource-add'),
              'p9': ('install-filter-injected-failure', 'all-source-filter'),
          }
          top = {'schema', 'runId', 'requiredCase', 'selectedCases', 'completedCases', 'pass', 'failure', 'install', 'lifecycle', 'fault'}
          install_counts = {'submissions', 'barrierReceipts', 'firstLoadReceipts', 'documentReceipts'}
          install_bools = {'submissionAccepted', 'installRejected', 'scriptAcknowledged', 'cdpAcknowledged', 'sourceMatched', 'syntheticResponseApplied', 'canonicalReadyControl', 'ackBeforeFirstLoad'}
          life_positive = {'staMain', 'callbackAffinity', 'noInheritedOverride', 'engineReady', 'bareHiddenUnfocused', 'constructionObserved', 'profileIsolated', 'destroyed', 'ownedReferencesReleased', 'runReturned', 'cleanupSucceeded'}
          life_fields = life_positive | {'bareWindowViolation', 'runtimeVersion'}
          fault_counts = {'targetReceipts', 'injectionReceipts', 'prematureLoadDenials', 'navigateAttempts', 'scriptSubmissions', 'cdpSubmissions', 'resourceAdds', 'filterAdds', 'resourceRemovals', 'filterRemovals', 'scriptRemovals', 'policyFailures'}
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate evidence member')
                  result[key] = value
              return result
          def invalid_constant(_):
              raise ValueError('non-JSON evidence number')
          def decode(raw):
              if len(raw) > 8192:
                  raise ValueError('evidence exceeds limit')
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique_object, parse_constant=invalid_constant)
          def expected_install(tag):
              d = {**dict.fromkeys(install_counts, 0), **dict.fromkeys(install_bools, False)}
              if tag != 'p0':
                  d['submissions'] = 1
                  d['installRejected'] = True
              return d
          def expected_fault(tag):
              d = {**dict.fromkeys(fault_counts, 0), 'target': cases[tag][1], 'targetReceipts': 1}
              if tag == 'p0':
                  d['prematureLoadDenials'] = 1
              else:
                  d['injectionReceipts'] = 1
                  d['policyFailures'] = 1
              if tag in ('p3', 'p9'):
                  d['resourceAdds'] = d['resourceRemovals'] = 1
              if tag == 'p9':
                  d['filterAdds'] = d['filterRemovals'] = 1
              return d
          def validate_case(raw, expected_run, tag):
              d = decode(raw)
              if type(d) is not dict or set(d) != top:
                  raise ValueError('boundary object schema mismatch')
              for field, expected in (('schema', 2), ('selectedCases', 1), ('completedCases', 1)):
                  if type(d[field]) is not int or d[field] != expected:
                      raise ValueError('boundary version or case count mismatch')
              for field, expected in (('runId', expected_run), ('requiredCase', cases[tag][0]), ('failure', 'none')):
                  if type(d[field]) is not str or d[field] != expected:
                      raise ValueError('boundary identity or completion mismatch')
              if d['pass'] is not True:
                  raise ValueError('boundary case not GREEN')
              install, life, fault = d['install'], d['lifecycle'], d['fault']
              if type(install) is not dict or set(install) != install_counts | install_bools:
                  raise ValueError('install schema mismatch')
              for key, expected in expected_install(tag).items():
                  if key in install_counts:
                      if type(install[key]) is not int or install[key] != expected:
                          raise ValueError('install count mismatch')
                  elif install[key] is not expected:
                      raise ValueError('unexpected install ACK or rejection')
              if type(life) is not dict or set(life) != life_fields:
                  raise ValueError('lifecycle schema mismatch')
              if any(life[key] is not True for key in life_positive) or life['bareWindowViolation'] is not False:
                  raise ValueError('actual native lifecycle missing')
              if type(life['runtimeVersion']) is not str or re.fullmatch(r'[0-9.]{1,128}', life['runtimeVersion']) is None:
                  raise ValueError('runtime version invalid')
              if type(fault) is not dict or set(fault) != fault_counts | {'target'}:
                  raise ValueError('fault schema mismatch')
              for key, expected in expected_fault(tag).items():
                  if key == 'target':
                      if type(fault[key]) is not str or fault[key] != expected:
                          raise ValueError('wrong fault target')
                  elif type(fault[key]) is not int or fault[key] != expected:
                      raise ValueError('fault witness or operation count mismatch')
          def validate_exits(raw, expected_run):
              d = decode(raw)
              if type(d) is not dict or set(d) != {'schema', 'runId', 'cases'}:
                  raise ValueError('exit schema mismatch')
              if type(d['schema']) is not int or d['schema'] != 1 or d['runId'] != expected_run or type(d['runId']) is not str:
                  raise ValueError('exit identity mismatch')
              if type(d['cases']) is not list or len(d['cases']) != 4:
                  raise ValueError('exit case count mismatch')
              for row, (tag, (name, _)) in zip(d['cases'], cases.items()):
                  if type(row) is not dict or set(row) != {'tag', 'requiredCase', 'exitCode'}:
                      raise ValueError('exit row schema mismatch')
                  if row['tag'] != tag or type(row['tag']) is not str or row['requiredCase'] != name or type(row['requiredCase']) is not str:
                      raise ValueError('exit selection mismatch')
                  if type(row['exitCode']) is not int or row['exitCode'] != 0:
                      raise ValueError('native command did not succeed')
          # In-memory parser canaries ONLY, never native acceptance or output artifacts.
          for tag in cases:
              canary = {'schema': 2, 'runId': 'sync-validator-canary', 'requiredCase': cases[tag][0], 'selectedCases': 1, 'completedCases': 1, 'pass': True, 'failure': 'none', 'install': expected_install(tag), 'fault': expected_fault(tag), 'lifecycle': {**dict.fromkeys(life_positive, True), 'bareWindowViolation': False, 'runtimeVersion': '1.2.3.4'}}
              valid = json.dumps(canary).encode()
              validate_case(valid, 'sync-validator-canary', tag)
              malformed = [b'[' + valid + b']', b'{"schema":2,' + valid[1:], valid + b' ' * 8193]
              for path, value in [(('fault', 'navigateAttempts'), False), (('fault', 'targetReceipts'), 0), (('fault', 'injectionReceipts'), 0 if tag != 'p0' else 1), (('lifecycle', 'ownedReferencesReleased'), False), (('install', 'barrierReceipts'), 1)]:
                  bad = copy.deepcopy(canary)
                  bad[path[0]][path[1]] = value
                  malformed.append(json.dumps(bad).encode())
              for raw in malformed:
                  try:
                      validate_case(raw, 'sync-validator-canary', tag)
                  except (ValueError, TypeError, UnicodeError):
                      continue
                  raise SystemExit('Code0 sync parser self-check failed')
          exit_canary = {'schema': 1, 'runId': 'sync-exit-canary', 'cases': [{'tag': tag, 'requiredCase': name, 'exitCode': 0} for tag, (name, _) in cases.items()]}
          validate_exits(json.dumps(exit_canary).encode(), 'sync-exit-canary')
          for value in (False, 1, 124):
              bad = copy.deepcopy(exit_canary)
              bad['cases'][1]['exitCode'] = value
              try:
                  validate_exits(json.dumps(bad).encode(), 'sync-exit-canary')
              except ValueError:
                  continue
              raise SystemExit('Code0 exit parser self-check failed')
          print('Code0 sync parser self-checks passed; no native acceptance implied.')
          # Actual run artifacts only; case identity derives from CI, never supplied JSON.
          run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          root = Path(os.environ['RUNNER_TEMP'])
          failed = False
          for tag in cases:
              expected_run = f'code0-policy-{tag}-{run}-{attempt}'
              try:
                  with (root / f'{expected_run}.json').open('rb') as source:
                      validate_case(source.read(8193), expected_run, tag)
              except (OSError, ValueError, TypeError, UnicodeError):
                  print(f'Code0 {tag} evidence missing, malformed, or not GREEN.')
                  failed = True
          try:
              expected_run = f'code0-policy-sync-{run}-{attempt}'
              with (root / f'{expected_run}-exits.json').open('rb') as source:
                  validate_exits(source.read(8193), expected_run)
          except (OSError, ValueError, TypeError, UnicodeError):
              print('Code0 sync native exit evidence missing, malformed, or not GREEN.')
              failed = True
          if failed:
              raise SystemExit('Code0 synchronous install evidence is not GREEN')
          print('Code0 synchronous install evidence passed: four required separate cases.')
      - name: Preserve Code0 synchronous install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code0-windows-policy-sync
          path: |
            ${{ runner.temp }}/code0-policy-p0-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/code0-policy-p2-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/code0-policy-p3-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/code0-policy-p9-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/code0-policy-sync-${{ github.run_id }}-${{ github.run_attempt }}-exits.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test Code0 asynchronous install boundaries
        working-directory: windows/src-tauri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $cases = @(
            @{ tag = "p4"; id = "install-script-injected-failure" },
            @{ tag = "p5"; id = "install-cdp-injected-failure" }
          )
          $records = [System.Collections.Generic.List[object]]::new()
          $failed = $false
          foreach ($case in $cases) {
            $env:AI_METER_CODE0_POLICY_RUN_ID = "code0-policy-$($case.tag)-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $env:AI_METER_CODE0_POLICY_SUMMARY = Join-Path $env:RUNNER_TEMP "$env:AI_METER_CODE0_POLICY_RUN_ID.json"
            $env:AI_METER_CODE0_NATIVE_DIAGNOSTICS = "1"
            & cargo test --locked --features code0-native-fixture --test code0_native_fixture -- "--code0-policy-fixture=$($case.id)"
            $code = $LASTEXITCODE
            $records.Add([ordered]@{ tag = $case.tag; requiredCase = $case.id; exitCode = [int]$code })
            if ($code -ne 0) { $failed = $true }
          }
          $runId = "code0-policy-async-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $exitPath = Join-Path $env:RUNNER_TEMP "$runId-exits.json"
          $payload = [ordered]@{ schema = 1; runId = $runId; cases = @($records.ToArray()) } | ConvertTo-Json -Depth 5 -Compress
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($payload)
