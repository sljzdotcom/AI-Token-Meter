                      for invalid in (True, False, 1.0, None, [], {}, 'wrong', 2):
                          must_reject(canary, changed(exit_data, (key,), invalid), selector)
                  must_reject(canary, {**exit_data, 'extra': 1}, selector)
                  must_reject(canary, {**exit_data, 'exitCode': 1}, selector)
                  must_reject(canary, {**exit_data, 'runId': 'stale'}, selector)
                  must_reject(changed(canary, ('runId',), 'stale'), exit_data, selector)
                  if selector != MISSING:
                      for values in ((1, 1, 3, 4), (2, 1, 3, 4), (1, 3, 2, 4), (1, 2, 4, 3)):
                          broken = copy.deepcopy(canary)
                          for key, value in zip(ORDINALS, values):
