                  must_reject(changed(canary, ('pass',), False), exit_data, selector)
                  # Every closed object's extra and missing members must fail.
                  for group in ((), ('install',), ('lifecycle',), ('nativeRefusal',), ('capability',)):
                      node = canary
                      for key in group:
                          node = node[key]
