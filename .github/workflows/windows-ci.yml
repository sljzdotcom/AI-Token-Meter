                      for key, value in zip(ORDINALS, (1, 2, 63, 64)):
                          boundary['capability'][key] = value
                      validate(boundary, exit_data, 'canary', selector)
                      # Each truthful inner RED fact must fail even if outer pass/exit lie.
                      baseline = copy.deepcopy(canary)
                      red_facts = {'result': 'baselineRefused', 'failure': 'CapabilityApprovalMissing',
                                   'permitRevokedAtAfterEntry': False, 'candidateApplied': 1,
                                   'candidateDeliveryOutcome': 'applied'}
                      for key, value in red_facts.items():
                          must_reject(changed(canary, ('capability', key), value), exit_data, selector)
                          baseline['capability'][key] = value
                      must_reject(baseline, exit_data, selector)
