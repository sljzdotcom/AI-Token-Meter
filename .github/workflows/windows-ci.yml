              resource_proof = {
                  'uiMatched': True, 'targetEstablishedAtEntry': True,
                  'closingAdmittedAtEntry': True, 'requestMatched': True,
                  'generationMatched': True, 'coreMatched': True, 's2InstallMatched': True,
                  'guardInstallMatched': True, 'registrationMatched': True,
                  'notReleased': True, 'notDestroyed': True, 'noPriorFailure': True,
                  'entryOrderCurrent': True, 'postDropCurrent': True,
                  'withinAttemptDeadline': True, 'withinCloseDeadline': True,
                  'entryAtMs': 101, 'settledAtMs': 103,
                  'emptyStreamCreated': True, 'seekSucceeded': True,
                  'fixedResponseCreated': True, 'responseSetAttempts': 1,
