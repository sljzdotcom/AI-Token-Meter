              if any(application[key] is not expected for key, expected in expected_application(tag).items()):
                  raise ValueError('actual callback application fact mismatch')
          def validate_exits(raw, expected_run):
              d = decode(raw)
              if type(d) is not dict or set(d) != {'schema', 'runId', 'cases'}:
                  raise ValueError('exit schema mismatch')
              if type(d['schema']) is not int or d['schema'] != 1 or d['runId'] != expected_run or type(d['runId']) is not str:
                  raise ValueError('exit identity mismatch')
              if type(d['cases']) is not list or len(d['cases']) != 2:
                  raise ValueError('exit case count mismatch')
              for row, (tag, (name, _)) in zip(d['cases'], cases.items()):
