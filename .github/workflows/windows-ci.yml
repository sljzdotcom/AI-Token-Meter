                  no_attempt = changed(canary, ('capability', 'candidateDeliveryAttempts'), 0)
                  no_attempt['capability']['candidateDeliveryOutcome'] = 'notAttempted'
                  must_reject(no_attempt, exit_data, selector)
                  for schema in (*range(1, 13), 14):
