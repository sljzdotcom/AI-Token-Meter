              exact(exit_data, {'schema': 1, 'runId': run_id, 'exitCode': 0})

          def must_reject(data, exit_data, selector):
              try:
                  validate(data, exit_data, 'canary', selector)
              except (ValueError, TypeError, AttributeError):
                  return
              raise ValueError('S4 parser accepted negative DATA')

          def changed(data, path, value):
              result = copy.deepcopy(data)
              node = result
              for key in path[:-1]:
                  node = node[key]
              node[path[-1]] = value
              return result

          def leaves(value, prefix=()):
              if type(value) is dict:
                  for key, item in value.items():
                      yield from leaves(item, prefix + (key,))
              else:
                  yield prefix, value

