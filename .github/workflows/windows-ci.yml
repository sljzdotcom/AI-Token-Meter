                      target['extra'] = True
                      must_reject(broken, exit_data, selector)
                      raw = json.dumps(canary, separators=(',', ':'))
                      if group:
                          key = next(iter(node))
                          marker = json.dumps(group[0]) + ':{'
                          pair = json.dumps(key) + ':' + json.dumps(node[key], separators=(',', ':'))
                          raw = raw.replace(marker, marker + pair + ',', 1)
                      else:
                          raw = '{"schema":13,' + raw[1:]
                      decode_must_reject(raw.encode('utf-8'))
                  for version in ('', 'x', '1' * 129, True, 1, None, [], {}):
                      for group in ('lifecycle', 'capability'):
                          must_reject(changed(canary, (group, 'runtimeVersion'), version), exit_data, selector)
                  must_reject(changed(canary, ('capability', 'runtimeVersion'), '9.9'), exit_data, selector)
                  must_reject(changed(canary, ('lifecycle', 'runtimeVersion'), '9.9'), exit_data, selector)
                  for other in SELECTORS:
                      if other != selector:
                          must_reject(changed(canary, ('requiredCase',), other), exit_data, selector)
                          must_reject(changed(canary, ('capability', 'selector'), other), exit_data, selector)
                          must_reject(canary, exit_data, other)
                  for bad_root in (False, 1, [], None):
                      must_reject(bad_root, exit_data, selector)
                      must_reject(canary, bad_root, selector)
                  for key in exit_data:
                      missing = copy.deepcopy(exit_data)
