          for tag in cases:
              canary = {'schema': 3, 'runId': 'async-validator-canary', 'requiredCase': cases[tag][0], 'selectedCases': 1, 'completedCases': 1, 'pass': True, 'failure': 'none', 'install': expected_install(tag), 'fault': expected_fault(tag), 'application': expected_application(tag), 'lifecycle': {**dict.fromkeys(life_positive, True), 'bareWindowViolation': False, 'runtimeVersion': '1.2.3.4'}}
