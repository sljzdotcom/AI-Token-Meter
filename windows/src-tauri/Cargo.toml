[package]
name = "ai-token-meter-windows"
version = "0.2.2"
description = "Windows client for AI Token Meter"
authors = ["Miller"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sljzdotcom/AI-Token-Meter"

[lib]
name = "ai_token_meter_windows"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-token-meter-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
